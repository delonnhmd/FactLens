<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Verifact email verification callback." />
    <title>Verifact Email Verification</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #667085;
        --border: #e4e7ec;
        --surface: #ffffff;
        --soft: #f5f7fa;
        --navy: #0d1b3e;
        --danger: #e24b4a;
        --danger-soft: #fcebeb;
        --success-soft: #e1f5ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--soft);
        color: var(--ink);
        display: flex;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        line-height: 1.5;
        margin: 0;
        min-height: 100vh;
        padding: 20px;
      }

      main {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        max-width: 480px;
        padding: 28px;
        text-align: center;
        width: 100%;
      }

      .mark {
        align-items: center;
        background: var(--success-soft);
        border-radius: 999px;
        color: var(--navy);
        display: inline-flex;
        font-size: 28px;
        font-weight: 800;
        height: 68px;
        justify-content: center;
        margin-bottom: 18px;
        width: 68px;
      }

      main[data-state="error"] .mark {
        background: var(--danger-soft);
        color: var(--danger);
      }

      h1 {
        color: var(--navy);
        font-size: 24px;
        letter-spacing: 0;
        line-height: 1.2;
        margin: 0 0 10px;
      }

      p {
        color: var(--muted);
        font-size: 15px;
        margin: 0 0 18px;
      }

      .actions {
        display: grid;
        gap: 10px;
      }

      a {
        align-items: center;
        border-radius: 8px;
        display: inline-flex;
        font-size: 14px;
        font-weight: 800;
        justify-content: center;
        min-height: 46px;
        padding: 11px 14px;
        text-decoration: none;
      }

      .primary {
        background: var(--navy);
        color: #ffffff;
      }

      .secondary {
        background: #ffffff;
        border: 1px solid var(--border);
        color: var(--navy);
      }

      .small {
        color: #98a2b3;
        font-size: 12px;
        margin: 16px 0 0;
      }
    </style>
  </head>
  <body>
    <main id="card" data-state="success">
      <div id="mark" class="mark">OK</div>
      <h1 id="title">Email verified successfully</h1>
      <p id="copy">Your account has been verified. You may now close this page and return to the Verifact app to sign in.</p>
    </main>
    <script>
      const search = window.location.search || "";
      const hash = window.location.hash || "";
      const hashParams = new URLSearchParams(hash.replace(/^#/, ""));
      const searchParams = new URLSearchParams(search.replace(/^\?/, ""));
      const error =
        hashParams.get("error_description") ||
        searchParams.get("error_description") ||
        hashParams.get("error") ||
        searchParams.get("error") ||
        "";
      const card = document.getElementById("card");
      const mark = document.getElementById("mark");
      const title = document.getElementById("title");
      const copy = document.getElementById("copy");

      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", error ? "/auth/callback" : "/auth/confirmed");
      }

      if (error) {
        card.dataset.state = "error";
        mark.textContent = "!";
        title.textContent = "Verification link problem";
        copy.textContent = "This verification link could not be used. Request a new verification email from the Verifact app and try again.";
      }
    </script>
  </body>
</html>
