<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Verifact email verification callback." />
    <title>Verifact Email Verification</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #667085;
        --border: #e4e7ec;
        --surface: #ffffff;
        --soft: #f5f7fa;
        --navy: #0d1b3e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--soft);
        color: var(--ink);
        display: flex;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        line-height: 1.5;
        margin: 0;
        min-height: 100vh;
        padding: 20px;
      }

      main {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        max-width: 460px;
        padding: 24px;
        text-align: center;
        width: 100%;
      }

      h1 {
        color: var(--navy);
        font-size: 22px;
        letter-spacing: 0;
        margin: 0 0 8px;
      }

      p {
        color: var(--muted);
        font-size: 15px;
        margin: 0 0 18px;
      }

      a {
        background: var(--navy);
        border-radius: 8px;
        color: #ffffff;
        display: inline-flex;
        font-size: 14px;
        font-weight: 800;
        padding: 11px 14px;
        text-decoration: none;
      }

      .small {
        font-size: 12px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Verifying your email...</h1>
      <p id="copy">Verifact is opening the app to finish verification.</p>
      <a id="open-app" href="verifact://auth/callback">Open Verifact</a>
      <p class="small">Email verified. You can return to Verifact.</p>
    </main>
    <script>
      const deepLink = `verifact://auth/callback${window.location.search || ""}${window.location.hash || ""}`;
      const openApp = document.getElementById("open-app");
      openApp.href = deepLink;

      window.setTimeout(() => {
        window.location.href = deepLink;
      }, 500);
    </script>
  </body>
</html>
