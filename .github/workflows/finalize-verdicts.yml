name: Finalize due claim verdicts

# Verdict finalization is exclusively server-side: this cron calls the
# backend's /internal/finalize-sweep every 10 minutes, which finalizes every
# claim past its 24-hour voting deadline (Verdict Formula v1, service-role
# write). The sweep is idempotent — already-finalized claims are skipped —
# so overlapping or late runs are harmless.
#
# Requires the FINALIZE_SWEEP_SECRET repository secret (Settings -> Secrets
# and variables -> Actions). Its value must match the backend's
# FINALIZE_SWEEP_SECRET env var on Render (or SAFETY_WEBHOOK_SECRET, which
# the endpoint accepts as a fallback so no new Render env var is needed).
#
# Note: GitHub disables scheduled workflows after 60 days without repo
# activity, and schedules can run a few minutes late under GitHub's load —
# the sweep catching up late is fine because it is idempotent.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run finalize sweep
        env:
          FINALIZE_SWEEP_SECRET: ${{ secrets.FINALIZE_SWEEP_SECRET }}
        run: |
          set -u

          endpoint="https://factlens-e8uf.onrender.com/internal/finalize-sweep"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          echo "Endpoint: $endpoint"
          if [ -z "$FINALIZE_SWEEP_SECRET" ]; then
            echo "::warning title=Missing FINALIZE_SWEEP_SECRET::The repository secret is empty or unavailable to this workflow."
          fi

          curl_exit=0
          metrics="$(curl -sS --max-time 120 \
            -o "$response_file" \
            -w "%{http_code} %{time_total}" \
            -X POST "$endpoint" \
            -H "x-finalize-secret: $FINALIZE_SWEEP_SECRET")" || curl_exit=$?

          read -r http_status request_duration <<< "$metrics"
          http_status="${http_status:-000}"
          request_duration="${request_duration:-unknown}"
          response_body="$(head -c 4000 "$response_file" | tr '\r\n' '  ')"

          echo "HTTP status: $http_status"
          echo "Request duration: ${request_duration}s"
          echo "Response body: ${response_body:-<empty>}"

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error title=Finalize sweep transport failure::curl exited with code $curl_exit (HTTP $http_status)."
            exit 1
          fi

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error title=Finalize sweep HTTP $http_status::The production endpoint returned a non-2xx response. See the safe response body above."
            exit 1
          fi
